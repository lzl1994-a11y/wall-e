<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>瓦力 Wi-Fi 配置</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/wifi.css"><script src="/wifi.js" defer></script></head>
<body><main class="wifi-page">
<article class="card">
<h1>瓦力 Wi-Fi 配置</h1>
<p>先连接胸前屏幕显示的热点，再打开屏幕地址。此页面无需互联网。</p>
<div id="auth"><label class="field"><span>局域网访问令牌（与设置页相同）</span><input id="token" type="password" autocomplete="off"></label><p>连接瓦力热点后重新打开此页面可直接配网；从其他网络访问时请输入令牌。</p></div>
<button id="refresh" class="button secondary" type="button">刷新状态并扫描 Wi-Fi</button>
<form id="connect-form">
<label class="field"><span>选择 Wi-Fi</span><select id="ssid" required><option value="">正在读取附近 Wi-Fi…</option></select></label>
<label class="field"><span>Wi-Fi 密码（开放网络留空）</span><input id="password" type="password" autocomplete="new-password"></label>
<p>目前支持 2.4 GHz 普通密码网络及开放网络。连接后手机会与瓦力热点断开，请将手机切换到目标 Wi-Fi。失败时瓦力会恢复原热点。</p>
<button id="connect" class="button primary" type="submit">连接并同步 ESP32</button>
</form>
<p id="status" role="status" aria-live="polite">正在读取配网状态…</p>
<a id="new-address" hidden></a>
<button id="retry" class="button secondary" type="button">重试 ESP32 同步</button>
<button id="setup" class="button secondary" type="button">重新进入热点配网</button>
<p><a href="/">返回设置页</a></p>
</article></main></body></html>
