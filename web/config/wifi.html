<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>瓦力 Wi-Fi 配置</title><link rel="stylesheet" href="/styles.css"><script src="/wifi.js" defer></script></head>
<body><main style="max-width:560px;margin:32px auto;padding:16px">
<article class="card">
<h1>瓦力 Wi-Fi 配置</h1>
<p>先连接胸前屏幕显示的热点，再打开屏幕地址。此页面无需互联网。</p>
<label class="field"><span>网页访问令牌（与设置页相同）</span><input id="token" type="password" autocomplete="off"></label>
<button id="refresh" class="button secondary" type="button">读取状态 / 扫描 Wi-Fi</button>
<form id="connect-form">
<label class="field"><span>Wi-Fi 名称（也可手动输入）</span><input id="ssid" list="networks" required autocomplete="off"><datalist id="networks"></datalist></label>
<label class="field"><span>Wi-Fi 密码（开放网络留空）</span><input id="password" type="password" autocomplete="new-password"></label>
<p>目前支持 2.4 GHz 普通密码网络及开放网络。连接后手机会与瓦力热点断开，请将手机切换到目标 Wi-Fi。失败时瓦力会恢复原热点。</p>
<button class="button primary" type="submit">连接并同步 ESP32</button>
</form>
<p id="status" role="status" aria-live="polite">请输入访问令牌，读取当前状态。</p>
<button id="retry" class="button secondary" type="button">重试 ESP32 同步</button>
<button id="setup" class="button secondary" type="button">重新进入热点配网</button>
<p><a href="/">返回设置页</a></p>
</article></main></body></html>
