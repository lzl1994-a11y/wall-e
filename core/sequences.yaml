poses:
  right_hand_up:
    default_step: 60.0
    targets:
      arm_r: 4000
      arm_l: 2000
  left_hand_up:
    default_step: 60.0
    targets:
      arm_r: 8000
      arm_l: 6000
  arms_up:
    default_step: 60.0
    targets:
      arm_r: 4000
      arm_l: 6000
  arms_down:
    default_step: 60.0
    targets:
      arm_r: 8000
      arm_l: 2000
  look_left_up:
    default_step: 120.0
    targets:
      head_yaw: 7600
      neck_top: init
      neck_bottom: max
  look_center:
    default_step: 120.0
    targets:
      head_yaw: 5000
      neck_top: init
      neck_bottom: init
  tilt_right:
    default_step: 80.0
    targets:
      eye_r: 2000
      eye_l: 6000
  tilt_left:
    default_step: 80.0
    targets:
      eye_r: 4000
      eye_l: 8192
  sad_eyes:
    default_step: 80.0
    targets:
      eye_r: 2000
      eye_l: 8192
  head_down:
    default_step: 80.0
    targets:
      neck_top: max
      neck_bottom: min
  turn_head_left:
    default_step: 60.0
    targets:
      head_yaw: 7600
  turn_head_right:
    default_step: 60.0
    targets:
      head_yaw: 1920
  tilt_head_left:
    default_step: 60.0
    targets:
      eye_l: 7500
      eye_r: 4000
  tilt_head_right:
    default_step: 60.0
    targets:
      eye_l: 5000
      eye_r: 2000
  eyebrows_open:
    default_step: 60.0
    targets:
      eyebrow_r: 4000
      eyebrow_l: 5900
  eyebrows_close:
    default_step: 60.0
    targets:
      eyebrow_r: 1920
      eyebrow_l: 8000
  # Conversational-expression candidates.  These are held poses, not timed
  # performances: a future dialogue-expression controller can blend into and
  # out of them without interrupting a named sequence.
  #
  # Neck coupling is mechanical: #7 (neck_bottom) rising while #6
  # (neck_top) stays still raises the neck and looks upward.  Looking down
  # decreases #7 while increasing #6.  The surprised pose intentionally uses
  # the maximum of both servos, as specified for this robot.
  expression_neutral:
    default_step: 24.0
    targets:
      eye_r: 3000
      eye_l: 6500
      eyebrow_r: 1920
      eyebrow_l: 8000
      head_yaw: 5000
      neck_top: init
      neck_bottom: init
  expression_listening:
    default_step: 20.0
    targets:
      eye_r: 3150
      eye_l: 6650
      eyebrow_r: 2500
      eyebrow_l: 7420
      head_yaw: 5200
      neck_top: init
      neck_bottom: {toward: max, fraction: 0.17}
  expression_thinking:
    default_step: 18.0
    targets:
      eye_r: 3300
      eye_l: 6800
      eyebrow_r: 2800
      eyebrow_l: 7120
      head_yaw: 5800
      neck_top: init
      neck_bottom: {toward: max, fraction: 0.33}
  expression_happy:
    default_step: 24.0
    targets:
      eye_r: 3000
      eye_l: 6500
      eyebrow_r: 3400
      eyebrow_l: 6520
      head_yaw: 5000
      neck_top: init
      neck_bottom: {toward: max, fraction: 0.22}
  expression_sad:
    default_step: 18.0
    targets:
      eye_r: 2400
      eye_l: 5900
      eyebrow_r: 2050
      eyebrow_l: 7870
      head_yaw: 5000
      neck_top: {toward: max, fraction: 0.75}
      neck_bottom: {toward: min, fraction: 0.60}
  expression_surprised:
    default_step: 32.0
    targets:
      eye_r: 2900
      eye_l: 6400
      eyebrow_r: 4200
      eyebrow_l: 5700
      head_yaw: 5000
      neck_top: max
      neck_bottom: max
  expression_confused:
    default_step: 18.0
    targets:
      eye_r: 3250
      eye_l: 6750
      eyebrow_r: 3500
      eyebrow_l: 7600
      head_yaw: 6400
      neck_top: init
      neck_bottom: {toward: max, fraction: 0.17}
  expression_concerned:
    default_step: 18.0
    targets:
      eye_r: 2700
      eye_l: 6200
      eyebrow_r: 2300
      eyebrow_l: 7700
      head_yaw: 4700
      neck_top: {toward: max, fraction: 0.45}
      neck_bottom: {toward: min, fraction: 0.40}
action_metadata:
  right_hand_up:
    label: 抬右手
    remark: 右臂抬起，左臂保持当前姿态
  left_hand_up:
    label: 抬左手
    remark: 左臂抬起，右臂保持当前姿态
  arms_up:
    label: 双臂抬起
    remark: 两侧手臂一起抬起
  arms_down:
    label: 双臂放下
    remark: 两侧手臂回到放下位置
  look_left_up:
    label: 向左上看
    remark: 头部向左并抬头
  look_center:
    label: 回正
    remark: 头部和脖子回到中性位置
  tilt_right:
    label: 眼睛右倾
    remark: 双眼向右倾斜
  tilt_left:
    label: 眼睛左倾
    remark: 双眼向左倾斜
  sad_eyes:
    label: 悲伤眼神
    remark: 眼睛下垂，配合悲伤表情
  head_down:
    label: 低头
    remark: 脖子向下收
  turn_head_left:
    label: 头转左
    remark: 头部水平转向左侧
  turn_head_right:
    label: 头转右
    remark: 头部水平转向右侧
  tilt_head_left:
    label: 头向左倾
    remark: 头部和眼睛向左倾斜
  tilt_head_right:
    label: 头向右倾
    remark: 头部和眼睛向右倾斜
  eyebrows_open:
    label: 眉毛张开
    remark: 两侧眉毛抬起
  eyebrows_close:
    label: 眉毛收拢
    remark: 两侧眉毛压低
  expression_neutral:
    label: 中性表情
    remark: 回到默认面部表情
  expression_listening:
    label: 倾听表情
    remark: 轻微抬头并睁眼倾听
  expression_thinking:
    label: 思考表情
    remark: 眼神偏移，轻微抬头
  expression_happy:
    label: 开心表情
    remark: 抬眉并露出开心神态
  expression_sad:
    label: 悲伤表情
    remark: 眉眼下垂
  expression_surprised:
    label: 惊讶表情
    remark: 眉毛和脖子同时抬起
  expression_confused:
    label: 疑惑表情
    remark: 眼神偏移并抬眉
  expression_concerned:
    label: 担忧表情
    remark: 眉眼收紧
  happy_dance:
    label: 开心舞步
    remark: 手臂摆动并包含履带旋转；网页预览会跳过履带
  wave_hello:
    label: 挥手问好
    remark: 抬头并挥动右手
  basic_nod:
    label: 点头
    remark: 头部上下点动
  basic_shake_head:
    label: 摇头
    remark: 头部左右摆动
  basic_wave:
    label: 基础挥手
    remark: 右臂往复摆动
  complex_greet:
    label: 完整问候
    remark: 表情、抬手和点头组成的问候动作
  sad_react:
    label: 悲伤反应
    remark: 切换到悲伤表情并低头
  scared:
    label: 害怕反应
    remark: 切换到惊讶或收缩姿态
  raise_hand:
    label: 举手
    remark: 抬起一侧手臂

sequences:
  happy_dance:
  - time: 0.0
    actions:
    - type: express_emotion
      emotion: happy
    - type: motor
      direction: spin
      duration: 2.0
    - type: servo
      name: arm_r
      pwm: 4000
      step_size: 160.0
    - type: servo
      name: arm_l
      pwm: 6000
      step_size: 80.0
    - type: servo
      name: head_yaw
      pwm: 1920
      step_size: 120.0
  - time: 1.0
    actions:
    - type: servo
      name: head_yaw
      pwm: 7600
      step_size: 120.0
  - time: 2.0
    actions:
    - type: pose
      name: look_center
    - type: pose
      name: arms_down
    - type: motor
      direction: backward
      duration: 1.0
  wave_hello:
  - time: 0.0
    actions:
    - type: express_emotion
      emotion: happy
    - type: servo
      name: arm_r
      pwm: 4000
      step_size: 160.0
    - type: servo
      name: head_yaw
      pwm: 7600
      step_size: 80.0
  - time: 0.5
    actions:
    - type: servo
      name: arm_r
      pwm: 6000
      step_size: 160.0
  - time: 1.0
    actions:
    - type: servo
      name: arm_r
      pwm: 4000
      step_size: 160.0
  - time: 1.5
    actions:
    - type: pose
      name: arms_down
    - type: pose
      name: look_center
  basic_nod:
  - time: 0.0
    actions:
    - type: servo
      name: neck_top
      pwm: 6000
      step_size: 200.0
  - time: 0.3
    actions:
    - type: servo
      name: neck_top
      pwm: 4000
      step_size: 200.0
  basic_shake_head:
  - time: 0.0
    actions:
    - type: servo
      name: head_yaw
      pwm: 6500
      step_size: 180.0
  - time: 0.35
    actions:
    - type: servo
      name: head_yaw
      pwm: 3500
      step_size: 180.0
  - time: 0.7
    actions:
    - type: servo
      name: head_yaw
      pwm: 6500
      step_size: 180.0
  - time: 1.05
    actions:
    - type: pose
      name: look_center
      step_size: 180.0
  basic_wave:
  - time: 0.0
    actions:
    - type: servo
      name: arm_r
      pwm: 4000
      step_size: 160.0
  - time: 0.5
    actions:
    - type: servo
      name: arm_r
      pwm: 6000
      step_size: 160.0
  complex_greet:
  - time: 0.0
    actions:
    - type: express_emotion
      emotion: happy
    - type: sequence
      name: basic_wave
    - type: pose
      name: look_left_up
      step_size: 40.0
  - time: 2.0
    actions:
    - type: sequence
      name: basic_nod
    - type: pose
      name: look_center
  sad_react:
  - time: 0.0
    actions:
    - type: express_emotion
      emotion: sad
    - type: pose
      name: sad_eyes
      step_size: 40.0
    - type: pose
      name: arms_down
      step_size: 60.0
    - type: pose
      name: eyebrows_close
      step_size: 40.0
    - type: pose
      name: head_down
      step_size: 40.0
  scared:
  - time: 0.0
    actions:
    - type: express_emotion
      emotion: sad
    - type: pose
      name: sad_eyes
      step_size: 120.0
  - time: 1.0
    actions:
    - type: pose
      name: arms_up
      step_size: 200.0
  raise_hand:
  - time: 0.0
    actions:
    - type: express_emotion
      emotion: happy
    - type: pose
      name: right_hand_up
      step_size: 160.0
    - type: pose
      name: look_left_up
      step_size: 120.0
  - time: 2.0
    actions:
    - type: pose
      name: arms_down
      step_size: 120.0
    - type: pose
      name: look_center
      step_size: 120.0
